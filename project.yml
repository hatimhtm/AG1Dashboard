name: AdPulse

options:
  bundleIdPrefix: com.hatim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ─── Main App ────────────────────────────────────────────────────────────
  AdPulse:
    type: application
    platform: iOS
    sources:
      - path: AdPulseApp.swift
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Theme
      - path: Views
      - path: Shared
    resources:
      - path: AdPulse-Data.csv
      - path: Resources/Assets.xcassets
    dependencies:
      - target: AdPulseWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.adpulse
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdPulse
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  # ─── Widget Extension (Live Activity) ────────────────────────────────────
  AdPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "SETUP.md"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.adpulse.AdPulseWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: AdPulseWidgets
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ─── Unit Tests ──────────────────────────────────────────────────────────
  AdPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AdPulseTests
    dependencies:
      - target: AdPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.adpulse.AdPulseTests
        TARGETED_DEVICE_FAMILY: "1"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AdPulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AdPulse"

schemes:
  AdPulse:
    build:
      targets:
        AdPulse: all
        AdPulseWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AdPulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
